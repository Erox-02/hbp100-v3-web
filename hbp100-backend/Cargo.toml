[package]
name = "hbp100-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
hbp100 = "3.0.1"
reqwest = { version = "0.11", features = ["stream", "json"] }
tokio-stream = "0.1.19"
bytes = "1"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"